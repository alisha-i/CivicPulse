apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: civicpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: civicpulse-backend:latest
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@postgres:5432/civicpulse
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: TRIAGE_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: civicpulse-config
              key: TRIAGE_PROVIDER
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: civicpulse-secrets
              key: GROQ_API_KEY
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: civicpulse
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
