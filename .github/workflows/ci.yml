name: CivicPulse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Ruff Linting
        run: |
          cd backend
          ruff check . --ignore B008,BLE001,S110,F841,TRY002
          ruff format --check .

      - name: Run Pytest Coverage
        run: |
          cd backend
          pytest --cov=app --cov-report=term --cov-fail-under=75 tests/

  docker-build-verify:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t civicpulse-backend ./backend

      - name: Build Frontend Image
        run: docker build -t civicpulse-frontend ./frontend
