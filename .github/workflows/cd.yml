name: CivicPulse CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff httpx
      - name: Run Ruff Linting
        run: |
          cd backend
          ruff check . --ignore B008,BLE001,S110,F841,TRY002
      - name: Run Pytest
        run: |
          cd backend
          pytest --cov=app --cov-report=term --cov-fail-under=75 tests/

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/civicpulse-backend:latest
            
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:latest
            
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}

  deploy-k8s:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: civicpulse-cluster

      - name: Update Kubernetes deployment images
        run: |
          cd k8s
          sed -i 's|image: civicpulse-backend:latest|image: ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}|g' backend-deployment.yaml
          sed -i 's|image: civicpulse-frontend:latest|image: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}|g' frontend-deployment.yaml

      - name: Deploy to Cluster
        run: |
          kubectl apply -f k8s/namespace.yaml
          
          # Create secret for pulling private GHCR images
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            -n civicpulse
          kubectl patch serviceaccount default -p '{"imagePullSecrets": [{"name": "ghcr-secret"}]}' -n civicpulse
            
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/hpa.yaml
          
      - name: Wait for Rollout
        run: |
          sleep 10
          kubectl get pods -n civicpulse
          
      - name: Print HPA
        run: |
          kubectl get hpa -n civicpulse
